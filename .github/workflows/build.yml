name: Build and Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Install NSIS
      run: sudo apt-get update && sudo apt-get install -y nsis

    - name: Build with Maven (Fat JAR & Executable)
      run: mvn clean package -DskipTests

    - name: Build Windows Installer (.exe)
      run: makensis installer.nsi

    - name: Upload Application JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CollegeCertGen-Pro-JAR
        path: target/CollegeCertGen-Pro.jar

    - name: Upload Windows Standalone Executable
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Standalone-Executable
        path: target/CollegeCertificateManagementSystem.exe

    - name: Upload Windows Setup Installer (.exe)
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Setup-Installer
        path: CollegeCertificateManagementSystem-Installer.exe
